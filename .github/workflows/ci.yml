name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the run; every commit on main gets a complete one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check
      - name: actionlint
        run: pixi run actionlint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: debug
      - name: Unit + integration tests
        run: pixi run test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  # What we carry ourselves: advisories, licenses, banned crates and sources, against deny.toml.
  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          cache: true
      - name: cargo deny
        run: pixi run -e lint deny

  # The MSRV is a promise: every other job builds on the far newer rustc the default environment pins.
  msrv:
    name: Builds on the MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: msrv
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the oldest supported toolchain
        run: pixi run -e msrv msrv-check

  # The release profile (LTO, one codegen unit) on every platform, on main only: a pull request's
  # debug build already compiled the same code.
  build:
    name: Build (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: release
      - name: Release build
        run: pixi run build
      - name: Smoke test
        run: pixi run cargo run --release -- --version

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true
      - name: Build the site strictly
        run: pixi run -e docs docs-build

  # The Rego example (examples/rego) against `pixi policy facts` of an example workspace, with OPA from conda-forge.
  rego:
    name: Rego example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default rego
          cache: true
      - name: Run the Rego example's tests
        run: pixi run -e rego rego-test

  # The GitHub Action from its source directory, with the newest released binary. All five release platforms,
  # because what this exercises is the action's own `RUNNER_OS-RUNNER_ARCH` mapping to a release archive; it
  # downloads a binary rather than compiling, so each leg is quick.
  action:
    name: Action (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-15-intel, target: osx-64 }
          - { os: macos-latest, target: osx-arm64 }
          - { os: windows-latest, target: win-64 }
    env:
      MANIFEST: examples/projects/pixi/01-django/pixi.toml
    steps:
      - uses: actions/checkout@v4
      # A policy that fails: django below 6 is banned, and 01-django locks 5.x.
      - name: Write the failing policy
        shell: bash
        run: |
          printf '[bans]\ndeny = [{ name = "django", version = "<6", reason = "too old" }]\n' > "$RUNNER_TEMP/fail.toml"
      - name: A failing policy, reported but not failing the step
        id: fail
        uses: ./actions/pixi-policy
        with:
          manifest-path: ${{ env.MANIFEST }}
          policy: ${{ runner.temp }}/fail.toml
          fail-on-findings: "false"
          json-output: ${{ runner.temp }}/fail.json
      - name: The failing policy's outputs
        shell: bash
        env:
          FAILED: ${{ steps.fail.outputs.failed }}
          JSON: ${{ steps.fail.outputs.json }}
          VERSION: ${{ steps.fail.outputs.version }}
        run: |
          set -euo pipefail
          echo "pixi-policy ${VERSION}"
          test "$FAILED" = true
          grep -q '"bans.deny"' "$JSON"
      - name: A failing policy fails the step
        id: gate
        continue-on-error: true
        uses: ./actions/pixi-policy
        with:
          manifest-path: ${{ env.MANIFEST }}
          policy: ${{ runner.temp }}/fail.toml
          summary: "false"
      - name: The gate failed
        shell: bash
        run: test "${{ steps.gate.outcome }}" = failure
      # The policy `init` proposes is one the workspace passes today.
      - name: Write a passing policy with init
        shell: bash
        run: pixi-policy init --manifest-path "$MANIFEST" --policy "$RUNNER_TEMP/pass.toml"
      - name: A passing policy
        id: pass
        uses: ./actions/pixi-policy
        with:
          manifest-path: ${{ env.MANIFEST }}
          policy: ${{ runner.temp }}/pass.toml
      - name: The passing policy's outputs
        shell: bash
        run: test "${{ steps.pass.outputs.failed }}" = false

  # The pre-commit hook from pre-commit-mirror/, rendered for the newest pixi-policy wheel on PyPI: a commit the
  # policy allows passes and one that adds a banned package is stopped. The hook installs the wheel, so nothing is
  # compiled.
  pre-commit-hook:
    name: pre-commit hook (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          cache: true
          activate-environment: lint
      - name: Try the hook
        shell: bash
        run: |
          set -euo pipefail
          version=$(curl -fsS https://pypi.org/pypi/pixi-policy/json | python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "pixi-policy ${version}"
          pre-commit-mirror/try.sh "$version" "$RUNNER_TEMP/hook"

  # The one check the branch ruleset requires and the Release workflow reads: every job that ran passed.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, test, coverage, deny, msrv, build, docs, rego, action, pre-commit-hook]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job ended $result"; exit 1 ;;
            esac
          done
