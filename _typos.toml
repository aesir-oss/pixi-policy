[files]
extend-exclude = [
  # Generated by git-cliff on release; commit hashes look like words to a spell checker.
  "CHANGELOG.md",
  "tests/fixtures/**",
  "tests/schemas/**",
  "**/snapshots/**",
  "Cargo.lock",
  "pixi.lock",
  # Lockfiles written by pixi: package names and hashes, not prose.
  "examples/projects/**",
]

[default.extend-words]
# PyPI package name used in tests
certifi = "certifi"
