site_name: pixi-policy
site_description: Check what a pixi workspace's environments may contain against a written policy
site_url: https://aesir-oss.github.io/pixi-policy/
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  overrides/

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - In development and CI: ci.md
  - GitHub Action: github-action.md
  - Rules: rules.md
  - Policy file reference: reference.md
  - License policy: licenses.md
  - Known vulnerabilities: advisories.md
  - Freshness: freshness.md
  - Waivers: waivers.md
  - Sharing a policy: extends.md
  - Output formats: output.md
  - Facts for OPA and Rego: rego.md
  - Development: development.md
  - Security policy: security.md
  - Changelog: changelog.md

hooks:
  - mkdocs_hooks.py

plugins:
  - search
  # Aliases (`latest`) are real copies so GitHub Pages serves them without symlinks or redirects, and every
  # version's pages declare the `latest` URL as canonical for search engines.
  - mike:
      alias_type: copy
      canonical_version: latest

repo_url: https://github.com/aesir-oss/pixi-policy
repo_name: aesir-oss/pixi-policy
copyright: Apache-2.0 licensed · Aesir Open Source Solutions

strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  # The Aesir brand (docs/overrides/aesir.css): Inter for text, JetBrains Mono for code.
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: aesir/mark
  # Light by default regardless of the OS preference; the toggle switches to dark. The colours themselves are the
  # brand's light and dark theme mapping, set in docs/overrides/aesir.css.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # Repository files published as pages of the site (mkdocs_hooks.py).
  repo_pages:
    CHANGELOG.md: changelog.md
    SECURITY.md: security.md
    # The JSON report's schema, at the address its $id names.
    schemas/pixi-policy-report.schema.json: schemas/pixi-policy-report.schema.json
    schemas/pixi-policy-facts.schema.json: schemas/pixi-policy-facts.schema.json
  # Version selector fed by mike's versions.json; the site root opens `latest`.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aesir-oss/pixi-policy
