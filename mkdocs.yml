INHERIT: ../../mkdocs.base.yml
site_name: pixi-policy
site_description: Check what a pixi workspace's environments may contain against a written policy
site_url: https://aesir-oss.github.io/pixi-ext-contrib/pixi-policy/
edit_uri: edit/main/crates/pixi-policy/docs/

docs_dir: docs

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - In development and CI: ci.md
  - Rules: rules.md
  - Policy file reference: reference.md
  - License policy: licenses.md
  - Waivers: waivers.md
  - Output formats: output.md
  - Contributing:
      - Development: https://aesir-oss.github.io/pixi-ext-contrib/development/
  - Security policy: https://aesir-oss.github.io/pixi-ext-contrib/security/
  - Changelog: changelog.md

hooks:
  - ../../mkdocs_hooks.py

theme:
  custom_dir: ../../docs/overrides
  favicon: https://aesir-oss.github.io/pixi-ext-contrib/assets/favicon.svg

plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest

extra:
  repo_pages:
    crates/pixi-policy/CHANGELOG.md: changelog.md
    # The JSON report's schema, at the address its $id names.
    crates/pixi-policy/schemas/pixi-policy-report.schema.json: schemas/pixi-policy-report.schema.json
  version:
    provider: mike
    default: latest
