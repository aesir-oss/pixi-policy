[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "pixi-policy"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "0.3.0-rc.1"
exclude-newer = "7d"

[dependencies]
rust = "==1.98.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt"
lint = "cargo clippy --all-targets -- -D warnings"
check = "cargo check --all-targets"
test = "cargo test"
test-integration = "cargo test --test '*'"
build = "cargo build --release"
policy-docs = { cmd = "cargo test --test docs", env = { PIXI_POLICY_WRITE_DOCS = "1" }, description = "regenerate the policy reference and rule catalog pages from the code" }
rego-facts = { cmd = "mkdir -p target/rego/flask && cargo run -q -- facts --manifest-path examples/projects/pixi/02-flask/pixi.toml --output target/rego/flask/facts.json", description = "write the facts the Rego example's tests read" }

# The oldest toolchain the crate claims to build on. Its own environment, because it pins a different rust than the
# one everything else uses; `pixi run -e msrv msrv-check` is what proves the number in Cargo.toml.
[feature.msrv.dependencies]
rust = "==1.88.0"

[feature.msrv.tasks]
msrv-check = "cargo check --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
git-cliff = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml.
deny = "cargo deny check"
actionlint = "actionlint"
pre-commit-run = "pre-commit run --all-files"
# A release's section goes on top of CHANGELOG.md; the sections below it are never rewritten.
changelog = { cmd = "bash scripts/changelog.sh", description = "add a release's section to CHANGELOG.md, below the header: changelog vX.Y.Z" }
changelog-notes = { cmd = "git cliff --latest --strip all", description = "the newest release's section, as the GitHub release's notes" }

[feature.cov.dependencies]
cargo-llvm-cov = "*"
cargo-insta = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --all-targets --fail-under-lines 90"

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

# The site toolchain comes from PyPI rather than conda-forge: conda-forge's mkdocs 1.6.1 build caps click below
# 8.3, which holds the lockfile on a click with a high command-injection advisory. Revisit when conda-forge ships an
# mkdocs build without the cap.
[feature.docs.dependencies]
python = "3.14.*"
click = ">=8.3.3"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6"
pymdown-extensions = ">=10"
mike = ">=2.1"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

# OPA, for the Rego example in examples/rego (#9): its tests run against the facts of an example workspace.
[feature.rego.dependencies]
opa = ">=1.0"

[feature.rego.tasks]
rego-test = { cmd = "opa test examples/rego target/rego -v", depends-on = [
  { task = "rego-facts", environment = "default" },
], description = "run the Rego example's tests against pixi policy facts" }

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
rego = { features = ["rego"], no-default-feature = true }
